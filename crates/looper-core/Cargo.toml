[package]
name = "looper-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Game loop sound library builder: sample-accurate loop points, crossfades, intensity variants and codec-aware verification"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hound = "3.5"
sha2 = "0.10"
# All codecs used here are pure Rust (hound for WAV I/O, Symphonia for
# decode-side verification of every emitted container, including lossy ones).
symphonia = { version = "0.5", default-features = false, features = ["wav", "ogg", "vorbis", "pcm", "mp3", "isomp4", "aac", "flac"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
