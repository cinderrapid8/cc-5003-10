[workspace]
resolver = "2"
members = [
    "crates/looper-core",
    "crates/looper-cli",
    "crates/looper-server",
]
# looper-tauri requires native WebKit/GTK libraries that minimal containers
# lack. It is part of the repository but built separately with
# `cargo build -p looper-tauri` on a desktop toolchain.
exclude = ["crates/looper-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/looper"

[workspace.dependencies]
looper-core = { path = "crates/looper-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Keep the whole build offline-friendly: pure Rust audio codecs only.
[profile.release]
lto = "thin"
codegen-units = 1
