# Reproducible offline release configuration for the game loop soundbank tool.
#
# Every path is relative to the repository root (the directory containing
# Cargo.toml). scripts/release/build-release.sh is the single entry point and
# reads this file; nothing here is inferred from a machine's directory layout.

# --- Identity ---------------------------------------------------------------
APP_NAME="looper-soundbank"
# Filled in by the build script from the workspace Cargo.toml version; kept
# here so a release can be re-tagged without editing the script.
VERSION=""

# --- Runners (Rust binaries) ------------------------------------------------
# Built in release mode and copied into bin/. Their only runtime dependencies
# are glibc system libraries; every audio decoder (WAV/OGG/Vorbis/MP3/AAC/
# FLAC via Symphonia) is statically compiled into the binaries, so the
# package needs no codec packages on the target machine.
CLI_BIN="looper-cli"
SERVER_BIN="looper-server"

# --- Authorized example material --------------------------------------------
# The demo soundbank is regenerated from these deterministic synth fixtures
# inside the clean build tree. No binary audio is copied from a developer
# machine, so the shipped examples are exactly what the MIT-licensed
# looper-core synth module emits. The project file lists every source with
# explicit loop regions and variant parameters.
DEMO_DIR="demo"
DEMO_PROJECT="project.json"
DEMO_SAMPLES_DIR="samples"
DEMO_OUT_DIR="out"
# Number of real loop wraps rendered per resource during the audition gate.
AUDITION_ROUNDS=4

# --- Frontend (offline static bundle) ---------------------------------------
FRONTEND_DIR="frontend"
# Vite output, served by looper-server's fallback service. It contains only
# static JS/CSS/HTML; the Tauri runtime is not required to open it.
FRONTEND_DIST="frontend/dist"

# --- Runtime binding --------------------------------------------------------
# Default port the launcher starts looper-server on. Overridable via
# LOOPER_PORT in the environment.
DEFAULT_PORT="8088"

# --- Packaging --------------------------------------------------------------
# Work happens under this directory, never inside the source tree's own
# demo/out or target. A failed build removes its partial stage so a
# half-finished release can never be mistaken for a complete one.
RELEASE_WORKDIR="release-workdir"
# Final self-contained directory and its reproducible tarball land here.
DIST_DIR="dist"
